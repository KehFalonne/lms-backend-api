services:
  db:
    image: postgres:16-alpine
    container_name: gu_lms_db
    environment:
      POSTGRES_DB: gu_lms
      POSTGRES_USER: gu_lms
      POSTGRES_PASSWORD: gu_lms_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gu_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gu_lms_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements/development.txt
    container_name: gu_lms_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_REDIS: "1"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements/development.txt
    container_name: gu_lms_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      USE_REDIS: "1"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - backend
      - redis
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements/development.txt
    container_name: gu_lms_celery_beat
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      USE_REDIS: "1"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - backend
      - redis
      
volumes:
  postgres_data: